{
  "logger": {
    "log_file": "/var/log/my_application.log",
    "log_level": "debug",
    "to_file": false,
    "to_stderr": false,
    "to_stdout": true
  },
  "server": {
    "port": 8080
  },
  "db": {
    "location": "database/dev.db",
  }
  "eventing": {
    "file_name": "database/list_history.dat",
    "cache": {
        "time_between_writes": 60,
        "data_file_lock_alert": 3600,
        "data_file_lock_override": 86400,
    }
    "compression": {
        "time": 0,
        "time_interval": 0,
        "size": 0,
        "size_check_interval": 0
    }
  }
}